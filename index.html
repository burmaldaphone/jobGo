<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>JobGo — Поиск вакансий</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: #f5f5f7;
      -webkit-font-smoothing: antialiased;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .filter-3d {
      perspective: 500px;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .filter-3d:hover {
      transform: scale(1.01) translateZ(2px);
    }
  </style>
</head>
<body class="text-gray-900 pb-10">

  <!-- Header -->
  <div class="sticky top-0 z-50 glass-card px-5 py-4 mb-6 shadow-sm border-b border-gray-200/50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-tight text-gray-900">JobGo</h1>
      <span class="text-xs font-semibold px-2.5 py-1 bg-gray-200/60 text-gray-600 rounded-full">v3.1</span>
    </div>
  </div>

  <div class="max-w-md mx-auto px-4 space-y-5">

    <!-- Поиск и фильтры -->
    <div class="bg-white rounded-3xl p-4 shadow-sm border border-gray-100 space-y-3 relative">
      
      <!-- Поле ввода профессии -->
      <div class="relative">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Например, Видеомонтажёр" 
          autocomplete="off"
          class="w-full bg-gray-100 text-gray-900 text-sm rounded-2xl px-4 py-3.5 pl-10 focus:outline-none focus:ring-2 focus:ring-black placeholder-gray-400 font-medium"
        />
        <svg class="w-5 h-5 absolute left-3.5 top-3.5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
      </div>

      <!-- Сетка фильтров -->
      <div class="grid grid-cols-2 gap-2 pt-1">
        
        <!-- Город -->
        <div class="relative">
          <div onclick="toggleCityDropdown()" class="filter-3d bg-gray-100 rounded-xl px-3 py-2.5 flex items-center justify-between cursor-pointer">
            <span id="cityLabel" class="text-xs font-semibold text-gray-700 truncate">🌆 Любой город</span>
            <span class="text-[10px] text-gray-400">▼</span>
          </div>
          <div id="cityDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-white rounded-2xl shadow-xl border border-gray-100 p-2 z-50 space-y-1">
            <div onclick="selectCity('')" class="px-3 py-2 text-xs font-medium hover:bg-gray-100 rounded-xl cursor-pointer">🌆 Любой город</div>
            <div onclick="selectCity('Москва')" class="px-3 py-2 text-xs font-medium hover:bg-gray-100 rounded-xl cursor-pointer">Москва</div>
            <div onclick="selectCity('Санкт-Петербург')" class="px-3 py-2 text-xs font-medium hover:bg-gray-100 rounded-xl cursor-pointer">Санкт-Петербург</div>
            <div class="pt-1 border-t border-gray-100">
              <input type="text" id="customCityInput" placeholder="✍️ Свой вариант..." oninput="onCustomCityInput(this.value)" class="w-full bg-gray-100 text-xs px-3 py-2 rounded-xl focus:outline-none"/>
            </div>
          </div>
        </div>

        <!-- Зарплата -->
        <div class="relative">
          <div onclick="toggleSalaryDropdown()" class="filter-3d bg-gray-100 rounded-xl px-3 py-2.5 flex items-center justify-between cursor-pointer">
            <span id="salaryLabel" class="text-xs font-semibold text-gray-700 truncate">💰 Любая</span>
            <span class="text-[10px] text-gray-400">▼</span>
          </div>
          <div id="salaryDropdown" class="hidden absolute right-0 left-0 top-full mt-2 bg-white rounded-2xl shadow-xl border border-gray-100 p-2 z-50 space-y-1">
            <div onclick="selectSalary('', '💰 Любая')" class="px-3 py-2 text-xs font-medium hover:bg-gray-100 rounded-xl cursor-pointer">💰 Любая</div>
            <div onclick="selectSalary('100000', 'От 100 000 ₽')" class="px-3 py-2 text-xs font-medium hover:bg-gray-100 rounded-xl cursor-pointer">От 100 000 ₽</div>
            <div class="pt-1 border-t border-gray-100">
              <input type="number" id="customSalaryInput" placeholder="✍️ Указать сумму..." oninput="onCustomSalaryInput(this.value)" class="w-full bg-gray-100 text-xs px-3 py-2 rounded-xl focus:outline-none"/>
            </div>
          </div>
        </div>

        <!-- Формат -->
        <select id="typeFilter" class="filter-3d bg-gray-100 text-xs font-semibold rounded-xl px-3 py-2.5 border-0 focus:ring-0 appearance-none">
          <option value="all">💻 Любой формат</option>
          <option value="remote">🏠 Удалённо</option>
          <option value="office">🏢 В офисе</option>
        </select>

        <!-- Источник -->
        <select id="sourceFilter" class="filter-3d bg-gray-100 text-xs font-semibold rounded-xl px-3 py-2.5 border-0 focus:ring-0 appearance-none">
          <option value="HeadHunter">🔴 HeadHunter</option>
        </select>

      </div>

      <button onclick="searchJobs()" class="w-full bg-black text-white font-bold text-sm py-3.5 rounded-2xl hover:bg-gray-800 transition-all">
        Найти вакансии ✨
      </button>

    </div>

    <!-- Результаты поиска -->
    <div id="vacanciesList" class="space-y-3"></div>

  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    let selectedCity = "";
    let selectedSalary = "";

    function toggleCityDropdown() { document.getElementById('cityDropdown').classList.toggle('hidden'); }
    function toggleSalaryDropdown() { document.getElementById('salaryDropdown').classList.toggle('hidden'); }

    function selectCity(city) {
      selectedCity = city;
      document.getElementById('cityLabel').innerText = city ? `🌆 ${city}` : '🌆 Любой город';
      document.getElementById('cityDropdown').classList.add('hidden');
    }

    function onCustomCityInput(val) {
      selectedCity = val.trim();
      document.getElementById('cityLabel').innerText = val.trim() ? `🌆 ${val.trim()}` : '🌆 Любой город';
    }

    function selectSalary(value, label) {
      selectedSalary = value;
      document.getElementById('salaryLabel').innerText = label;
      document.getElementById('salaryDropdown').classList.add('hidden');
    }

    function onCustomSalaryInput(val) {
      selectedSalary = val.trim();
      document.getElementById('salaryLabel').innerText = val.trim() ? `От ${val.trim()} ₽` : '💰 Любая';
    }

    // Ключевой поиск: отправляет фильтры в API Vercel!
    async function searchJobs() {
      let query = document.getElementById("searchInput").value.trim();
      if (!query) query = "Видеомонтажёр"; // Дефолт если пусто

      const type = document.getElementById('typeFilter').value;
      const vacanciesList = document.getElementById('vacanciesList');

      vacanciesList.innerHTML = `<div class="text-center py-12 text-sm text-gray-400">Ищем в базе HeadHunter...</div>`;

      // Формируем URL с параметрами для нашей Vercel API
      const params = new URLSearchParams({
        query: query,
        city: selectedCity,
        salary: selectedSalary,
        schedule: type
      });

      try {
        // Делаем запрос к нашей Serverless-функции
        const response = await fetch(`/api/vacancies?${params.toString()}`);
        const data = await response.json();

        if (!data.vacancies || data.vacancies.length === 0) {
          vacanciesList.innerHTML = `<div class="text-center py-10 bg-white rounded-3xl text-sm text-gray-500">Ничего не найдено с такими фильтрами.</div>`;
          return;
        }

        renderVacancies(data.vacancies);
      } catch (err) {
        vacanciesList.innerHTML = `<div class="text-center py-10 bg-red-50 text-red-600 rounded-3xl">Ошибка подключения к поиску.</div>`;
      }
    }

    function renderVacancies(vacancies) {
      document.getElementById('vacanciesList').innerHTML = vacancies.map(v => `
        <div class="bg-white p-5 rounded-3xl border border-gray-100">
          <div class="flex justify-between mb-2">
            <h3 class="font-bold text-base text-gray-900">${v.title}</h3>
            <span class="text-[10px] font-bold px-2 py-1 bg-red-50 text-red-600 rounded-full">${v.source}</span>
          </div>
          <div class="text-xs text-gray-500 mb-2">${v.company}</div>
          <div class="inline-block bg-emerald-50 text-emerald-700 text-xs font-bold px-3 py-1 rounded-xl mb-3">${v.salary}</div>
          <p class="text-xs text-gray-500 line-clamp-2 mb-4">${v.snippet}</p>
          <a href="${v.url}" target="_blank" class="block w-full text-center bg-gray-100 text-gray-900 text-xs py-3 rounded-2xl hover:bg-gray-200">Откликнуться на HH ↗</a>
        </div>
      `).join('');
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>JobGo — Найди работу мечты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --tg-bg: #eef0f7;
    --glass-bg: rgba(255, 255, 255, 0.55);
    --glass-border: rgba(255, 255, 255, 0.6);
    --accent-from: #6366f1;
    --accent-to: #a855f7;
  }

  * {
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 20% 0%, #e0e7ff 0%, transparent 45%),
                radial-gradient(circle at 90% 10%, #f3e8ff 0%, transparent 40%),
                radial-gradient(circle at 50% 100%, #dbeafe 0%, transparent 50%),
                var(--tg-bg);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Glassmorphism ---------- */
  .glass {
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 32px rgba(31, 38, 135, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.8);
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.65);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 4px 24px rgba(31, 38, 135, 0.06);
  }

  /* ---------- 3D Tilt filter fields ---------- */
  .filter-3d {
    transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.25s ease;
    transform-style: preserve-3d;
  }
  .filter-3d:hover, .filter-3d:focus-within {
    transform: translateY(-3px) scale(1.01);
    box-shadow: 0 12px 28px rgba(99, 102, 241, 0.15);
  }

  /* ---------- 3D Tilt main button (Balatro-style) ---------- */
  #searchBtn {
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.12s ease-out, box-shadow 0.12s ease-out;
    background: linear-gradient(135deg, var(--accent-from) 0%, var(--accent-to) 100%);
    box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4), 0 2px 0 rgba(255,255,255,0.3) inset;
    will-change: transform;
  }
  #searchBtn:active {
    transform: scale(0.97) !important;
  }
  #searchBtn .glare {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(circle at var(--glare-x, 50%) var(--glare-y, 0%), rgba(255,255,255,0.55), transparent 55%);
    opacity: 0;
    transition: opacity 0.2s ease;
    pointer-events: none;
  }
  #searchBtn:hover .glare,
  #searchBtn.tilting .glare {
    opacity: 1;
  }

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }

  /* ---------- Autocomplete dropdown ---------- */
  #autocompleteList {
    max-height: 220px;
    overflow-y: auto;
  }
  .autocomplete-item:hover, .autocomplete-item.active {
    background: rgba(99, 102, 241, 0.08);
  }

  /* ---------- Loader ---------- */
  .spinner {
    border: 3px solid rgba(99,102,241,0.15);
    border-top-color: var(--accent-from);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Fade in for cards ---------- */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .vacancy-card {
    animation: fadeSlideUp 0.4s ease both;
  }

  /* ---------- Custom select chevron hidden (native styled) ---------- */
  select {
    -webkit-appearance: none;
    appearance: none;
  }

  .segmented-btn.active {
    background: linear-gradient(135deg, var(--accent-from), var(--accent-to));
    color: white;
    box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  }
</style>
</head>
<body class="pb-10">

<div id="app" class="max-w-md mx-auto px-4 pt-6">

  <!-- Header -->
  <header class="mb-6 text-center">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl glass mb-3">
      <span class="text-2xl">💼</span>
    </div>
    <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">JobGo</h1>
    <p class="text-sm text-slate-500 mt-1">Найди работу мечты за 30 секунд</p>
  </header>

  <!-- Search form -->
  <section class="glass rounded-3xl p-4 space-y-3 relative z-20">

    <!-- Profession input with autocomplete -->
    <div class="relative filter-3d rounded-2xl">
      <label class="block text-xs font-semibold text-slate-500 px-4 pt-3">Профессия</label>
      <input
        id="queryInput"
        type="text"
        placeholder="Например, Frontend-разработчик"
        autocomplete="off"
        class="w-full bg-transparent px-4 pb-3 pt-1 text-slate-800 font-medium placeholder-slate-400 outline-none"
      />
      <div id="autocompleteList" class="hidden absolute left-0 right-0 top-full mt-2 glass-card rounded-2xl p-2 z-30"></div>
    </div>

    <!-- City select -->
    <div class="relative filter-3d rounded-2xl glass-card">
      <label class="block text-xs font-semibold text-slate-500 px-4 pt-3">Город</label>
      <select id="citySelect" class="w-full bg-transparent px-4 pb-3 pt-1 text-slate-800 font-medium outline-none">
        <option value="Москва">Москва</option>
        <option value="Санкт-Петербург">Санкт-Петербург</option>
        <option value="Казань">Казань</option>
        <option value="Екатеринбург">Екатеринбург</option>
        <option value="__custom">Другой город...</option>
      </select>
      <input
        id="customCityInput"
        type="text"
        placeholder="Введите город"
        class="hidden w-full bg-transparent px-4 pb-3 text-slate-800 font-medium placeholder-slate-400 outline-none border-t border-white/50"
      />
    </div>

    <!-- Salary select -->
    <div class="relative filter-3d rounded-2xl glass-card">
      <label class="block text-xs font-semibold text-slate-500 px-4 pt-3">Зарплата от</label>
      <select id="salarySelect" class="w-full bg-transparent px-4 pb-3 pt-1 text-slate-800 font-medium outline-none">
        <option value="">Не важно</option>
        <option value="50000">от 50 000 ₽</option>
        <option value="100000">от 100 000 ₽</option>
        <option value="150000">от 150 000 ₽</option>
        <option value="__custom">Своя сумма...</option>
      </select>
      <input
        id="customSalaryInput"
        type="number"
        placeholder="Введите сумму"
        class="hidden w-full bg-transparent px-4 pb-3 text-slate-800 font-medium placeholder-slate-400 outline-none border-t border-white/50"
      />
    </div>

    <!-- Schedule segmented control -->
    <div class="filter-3d rounded-2xl glass-card p-2">
      <label class="block text-xs font-semibold text-slate-500 px-2 pt-1 pb-2">Формат работы</label>
      <div class="grid grid-cols-3 gap-2" id="scheduleGroup">
        <button data-value="remote" class="segmented-btn text-sm font-semibold py-2 rounded-xl bg-white/60 text-slate-600 transition">Удалённо</button>
        <button data-value="office" class="segmented-btn text-sm font-semibold py-2 rounded-xl bg-white/60 text-slate-600 transition">В офисе</button>
        <button data-value="any" class="segmented-btn active text-sm font-semibold py-2 rounded-xl transition">Любой</button>
      </div>
    </div>

    <!-- 3D Tilt Search Button -->
    <button id="searchBtn" class="w-full text-white font-bold text-base py-4 rounded-2xl mt-2 relative overflow-hidden">
      <span class="glare"></span>
      <span id="searchBtnLabel" class="relative z-10">🔍 Найти вакансии</span>
    </button>
  </section>

  <!-- Loading state -->
  <div id="loadingState" class="hidden flex flex-col items-center justify-center py-12 gap-3">
    <div class="spinner w-10 h-10"></div>
    <p class="text-sm text-slate-500 font-medium">Ищем лучшие вакансии...</p>
  </div>

  <!-- Error state -->
  <div id="errorState" class="hidden glass-card rounded-2xl p-4 mt-6 text-center">
    <p class="text-sm text-red-500 font-semibold" id="errorMessage">Что-то пошло не так</p>
  </div>

  <!-- Results -->
  <section id="resultsSection" class="hidden mt-6 space-y-4">

    <!-- AI Analysis card -->
    <div id="aiAnalysisCard" class="hidden rounded-2xl p-4 bg-gradient-to-br from-indigo-50 to-purple-50 border border-indigo-100">
      <div class="flex items-center gap-2 mb-2">
        <span class="text-lg">✨</span>
        <h3 class="text-sm font-bold text-indigo-700">Анализ AI-ассистента</h3>
      </div>
      <p id="aiAnalysisText" class="text-sm text-slate-600 leading-relaxed"></p>
    </div>

    <div class="flex items-center justify-between px-1">
      <p class="text-sm text-slate-500 font-medium" id="resultsCount"></p>
    </div>

    <div id="vacanciesList" class="space-y-3"></div>

    <div id="emptyState" class="hidden text-center py-10">
      <p class="text-3xl mb-2">🔎</p>
      <p class="text-sm text-slate-500 font-medium">Вакансии не найдены. Попробуйте изменить фильтры.</p>
    </div>
  </section>

</div>

<script>
(function () {
  "use strict";

  // ---------------- Telegram WebApp init ----------------
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor("#eef0f7"); } catch (e) {} }
  }

  // ---------------- Elements ----------------
  const queryInput = document.getElementById("queryInput");
  const autocompleteList = document.getElementById("autocompleteList");
  const citySelect = document.getElementById("citySelect");
  const customCityInput = document.getElementById("customCityInput");
  const salarySelect = document.getElementById("salarySelect");
  const customSalaryInput = document.getElementById("customSalaryInput");
  const scheduleGroup = document.getElementById("scheduleGroup");
  const searchBtn = document.getElementById("searchBtn");

  const loadingState = document.getElementById("loadingState");
  const errorState = document.getElementById("errorState");
  const errorMessage = document.getElementById("errorMessage");
  const resultsSection = document.getElementById("resultsSection");
  const aiAnalysisCard = document.getElementById("aiAnalysisCard");
  const aiAnalysisText = document.getElementById("aiAnalysisText");
  const resultsCount = document.getElementById("resultsCount");
  const vacanciesList = document.getElementById("vacanciesList");
  const emptyState = document.getElementById("emptyState");

  let selectedSchedule = "any";

  // ---------------- Profession autocomplete ----------------
  const PROFESSIONS = [
    "Frontend-разработчик", "Backend-разработчик", "Fullstack-разработчик",
    "Python-разработчик", "Java-разработчик", "JavaScript-разработчик",
    "Data Scientist", "Data Analyst", "DevOps-инженер", "QA-инженер",
    "Product Manager", "Project Manager", "UX/UI-дизайнер", "Графический дизайнер",
    "SMM-менеджер", "Маркетолог", "Копирайтер", "Контент-менеджер",
    "Менеджер по продажам", "Бухгалтер", "Юрист", "HR-менеджер",
    "Системный администратор", "Аналитик 1С", "Android-разработчик", "iOS-разработчик",
    "Курьер", "Водитель", "Официант", "Повар", "Кассир", "Складской работник"
  ];

  function renderAutocomplete(matches) {
    if (!matches.length) {
      autocompleteList.classList.add("hidden");
      autocompleteList.innerHTML = "";
      return;
    }
    autocompleteList.innerHTML = matches
      .slice(0, 6)
      .map(
        (m) =>
          `<div class="autocomplete-item px-3 py-2 rounded-xl cursor-pointer text-sm text-slate-700 font-medium transition">${m}</div>`
      )
      .join("");
    autocompleteList.classList.remove("hidden");
  }

  queryInput.addEventListener("input", () => {
    const val = queryInput.value.trim().toLowerCase();
    if (!val) {
      renderAutocomplete([]);
      return;
    }
    const matches = PROFESSIONS.filter((p) => p.toLowerCase().includes(val));
    renderAutocomplete(matches);
  });

  autocompleteList.addEventListener("click", (e) => {
    const item = e.target.closest(".autocomplete-item");
    if (!item) return;
    queryInput.value = item.textContent;
    renderAutocomplete([]);
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest("#queryInput") && !e.target.closest("#autocompleteList")) {
      renderAutocomplete([]);
    }
  });

  // ---------------- City custom input ----------------
  citySelect.addEventListener("change", () => {
    if (citySelect.value === "__custom") {
      customCityInput.classList.remove("hidden");
      customCityInput.focus();
    } else {
      customCityInput.classList.add("hidden");
      customCityInput.value = "";
    }
  });

  // ---------------- Salary custom input ----------------
  salarySelect.addEventListener("change", () => {
    if (salarySelect.value === "__custom") {
      customSalaryInput.classList.remove("hidden");
      customSalaryInput.focus();
    } else {
      customSalaryInput.classList.add("hidden");
      customSalaryInput.value = "";
    }
  });

  // ---------------- Schedule segmented control ----------------
  scheduleGroup.addEventListener("click", (e) => {
    const btn = e.target.closest(".segmented-btn");
    if (!btn) return;
    [...scheduleGroup.querySelectorAll(".segmented-btn")].forEach((b) =>
      b.classList.remove("active")
    );
    btn.classList.add("active");
    selectedSchedule = btn.dataset.value;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
  });

  // ---------------- 3D Tilt effect on main button ----------------
  function applyTilt(el, clientX, clientY) {
    const rect = el.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    const rotateX = ((y / rect.height) - 0.5) * -12;
    const rotateY = ((x / rect.width) - 0.5) * 12;
    el.style.transform = `perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;
    el.style.setProperty("--glare-x", `${(x / rect.width) * 100}%`);
    el.style.setProperty("--glare-y", `${(y / rect.height) * 100}%`);
    el.classList.add("tilting");
  }

  function resetTilt(el) {
    el.style.transform = "perspective(600px) rotateX(0deg) rotateY(0deg) scale(1)";
    el.classList.remove("tilting");
  }

  searchBtn.addEventListener("mousemove", (e) => applyTilt(searchBtn, e.clientX, e.clientY));
  searchBtn.addEventListener("mouseleave", () => resetTilt(searchBtn));
  searchBtn.addEventListener(
    "touchmove",
    (e) => {
      if (e.touches && e.touches[0]) {
        applyTilt(searchBtn, e.touches[0].clientX, e.touches[0].clientY);
      }
    },
    { passive: true }
  );
  searchBtn.addEventListener("touchend", () => resetTilt(searchBtn));

  // ---------------- Filter-3d tilt (subtle) for inputs ----------------
  document.querySelectorAll(".filter-3d").forEach((el) => {
    el.addEventListener("mousemove", (e) => {
      const rect = el.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const rotateX = ((y / rect.height) - 0.5) * -4;
      const rotateY = ((x / rect.width) - 0.5) * 4;
      el.style.transform = `translateY(-3px) perspective(600px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });
    el.addEventListener("mouseleave", () => {
      el.style.transform = "";
    });
  });

  // ---------------- Search logic ----------------
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  function getVacancyEmoji(title) {
    const t = (title || "").toLowerCase();
    if (t.includes("разработ") || t.includes("develop") || t.includes("программист")) return "💻";
    if (t.includes("дизайн")) return "🎨";
    if (t.includes("маркет") || t.includes("smm")) return "📈";
    if (t.includes("продаж")) return "🤝";
    if (t.includes("водит") || t.includes("курьер")) return "🚗";
    if (t.includes("повар") || t.includes("официант")) return "🍳";
    return "💼";
  }

  function renderVacancies(vacancies) {
    if (!vacancies.length) {
      vacanciesList.innerHTML = "";
      emptyState.classList.remove("hidden");
      return;
    }
    emptyState.classList.add("hidden");

    vacanciesList.innerHTML = vacancies
      .map((v, idx) => {
        const emoji = getVacancyEmoji(v.title);
        return `
        <div class="vacancy-card glass-card rounded-2xl p-4" style="animation-delay:${idx * 0.04}s">
          <div class="flex items-start gap-3">
            <div class="w-11 h-11 rounded-xl bg-white/70 flex items-center justify-center text-xl shrink-0">${emoji}</div>
            <div class="flex-1 min-w-0">
              <h4 class="font-bold text-slate-800 text-sm leading-snug">${escapeHtml(v.title)}</h4>
              <p class="text-xs text-slate-500 mt-0.5">${escapeHtml(v.company)} ${v.city ? "· " + escapeHtml(v.city) : ""}</p>
              <p class="text-sm font-bold text-indigo-600 mt-2">${escapeHtml(v.salary)}</p>
              ${
                v.snippetRequirement
                  ? `<p class="text-xs text-slate-500 mt-2 leading-relaxed line-clamp-3">${escapeHtml(v.snippetRequirement)}</p>`
                  : ""
              }
              <div class="flex items-center gap-2 mt-3">
                <a href="${v.url}" target="_blank" rel="noopener noreferrer"
                   class="flex-1 text-center text-xs font-bold py-2.5 rounded-xl text-white bg-gradient-to-r from-indigo-500 to-purple-500 active:scale-95 transition">
                   Откликнуться
                </a>
                <a href="${v.url}" target="_blank" rel="noopener noreferrer"
                   class="text-center text-xs font-semibold py-2.5 px-3 rounded-xl bg-white/70 text-slate-600 active:scale-95 transition">
                   Открыть
                </a>
              </div>
            </div>
          </div>
        </div>`;
      })
      .join("");
  }

  function setLoading(isLoading) {
    loadingState.classList.toggle("hidden", !isLoading);
    if (isLoading) {
      errorState.classList.add("hidden");
      resultsSection.classList.add("hidden");
      searchBtn.disabled = true;
      searchBtn.style.opacity = "0.7";
    } else {
      searchBtn.disabled = false;
      searchBtn.style.opacity = "1";
    }
  }

  async function handleSearch() {
    renderAutocomplete([]);

    const query = queryInput.value.trim();
    const city =
      citySelect.value === "__custom" ? customCityInput.value.trim() : citySelect.value;
    const salary =
      salarySelect.value === "__custom" ? customSalaryInput.value.trim() : salarySelect.value;
    const schedule = selectedSchedule === "remote" ? "remote" : "";

    if (!query && !city) {
      errorMessage.textContent = "Введите профессию или выберите город";
      errorState.classList.remove("hidden");
      return;
    }

    setLoading(true);

    try {
      const params = new URLSearchParams();
      if (query) params.set("query", query);
      if (city) params.set("city", city);
      if (salary) params.set("salary", salary);
      if (schedule) params.set("schedule", schedule);

      const res = await fetch(`/api/vacancies?${params.toString()}`);
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data?.error || "Ошибка загрузки вакансий");
      }

      setLoading(false);
      resultsSection.classList.remove("hidden");
      resultsCount.textContent = `Найдено вакансий: ${data.found ?? data.count ?? 0}`;

      if (data.aiAnalysis) {
        aiAnalysisText.textContent = data.aiAnalysis;
        aiAnalysisCard.classList.remove("hidden");
      } else {
        aiAnalysisCard.classList.add("hidden");
      }

      renderVacancies(data.vacancies || []);

      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
    } catch (err) {
      setLoading(false);
      errorMessage.textContent = err.message || "Не удалось загрузить вакансии. Попробуйте позже.";
      errorState.classList.remove("hidden");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    }
  }

  searchBtn.addEventListener("click", handleSearch);
  queryInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") handleSearch();
  });
})();
</script>
</body>
</html>

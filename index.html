<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>JobGo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #000000;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #007aff;
      --accent-light: #5ac8fa;
      --accent-green: #34c759;
      --accent-purple: #af52de;
      --text: #f2f2f7;
      --text-secondary: #8e8e93;
      --text-muted: #636366;
      --card: rgba(28, 28, 30, 0.72);
      --separator: rgba(255, 255, 255, 0.06);
      --danger: #ff3b30;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      background:
        radial-gradient(ellipse 60% 40% at 30% -10%, rgba(0,122,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 110%, rgba(175,82,222,0.05) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,122,255,0.02) 0%, transparent 80%),
        var(--bg);
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--glass-border);
    }
    .filter-card {
      background: var(--card);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 14px 16px;
      transition: transform 0.2s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.2s ease, border-color 0.2s ease;
      transform-style: preserve-3d; perspective: 1000px;
      cursor: pointer;
    }
    .filter-card:hover {
      transform: translateY(-2px) translateZ(4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.12);
    }
    .filter-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-secondary); margin-bottom: 8px; display: block;
    }
    .filter-value {
      font-size: 15px; color: var(--text); display: flex; align-items: center; justify-content: space-between;
    }
    .filter-value .placeholder { color: var(--text-muted); }
    .filter-value .arrow { color: var(--text-muted); font-size: 12px; }
    .tilt-btn {
      position: relative; transform-style: preserve-3d; perspective: 1000px;
      transition: transform 0.18s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.18s ease;
      cursor: pointer; overflow: hidden; border: none; outline: none;
      -webkit-user-select: none; user-select: none;
    }
    .tilt-btn::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.3) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.35s ease; pointer-events: none; z-index: 1; border-radius: inherit;
    }
    .tilt-btn:hover::after { opacity: 1; }
    .tilt-btn:active { transform: scale(0.97) !important; transition: transform 0.08s ease; }
    .tilt-btn .shine {
      position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.1) 42%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 58%, transparent 70%);
      transform: rotate(20deg) translateX(-130%); pointer-events: none; z-index: 0; transition: transform 0.6s ease;
    }
    .tilt-btn:hover .shine { transform: rotate(20deg) translateX(30%); }
    .tilt-btn .btn-text { position: relative; z-index: 2; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      width: 100%; max-height: 75vh;
      background: rgba(28, 28, 30, 0.98);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border-top: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px 24px 0 0;
      padding: 0; overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    .modal-overlay.active .modal-sheet { transform: translateY(0); }
    .modal-handle {
      width: 36px; height: 5px; border-radius: 3px;
      background: rgba(255,255,255,0.2); margin: 12px auto 0;
    }
    .modal-header {
      padding: 16px 20px 12px; display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 17px; font-weight: 600; }
    .modal-close {
      width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.06); border: none; color: var(--text-secondary); cursor: pointer; font-size: 18px;
    }
    .modal-search {
      margin: 0 16px 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); border-radius: 12px; padding: 12px 16px 12px 44px; font-size: 16px;
      font-family: inherit; width: calc(100% - 32px); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .modal-search:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
    .modal-search::placeholder { color: var(--text-muted); }
    .modal-search-wrap { position: relative; }
    .modal-search-wrap svg {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }
    .modal-list { max-height: calc(75vh - 180px); overflow-y: auto; padding: 0 8px; }
    .modal-list::-webkit-scrollbar { display: none; }
    .modal-item {
      padding: 14px 16px; border-radius: 14px; cursor: pointer;
      font-size: 16px; color: var(--text); transition: background 0.12s ease;
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-item:hover { background: rgba(0,122,255,0.08); }
    .modal-item.selected { color: var(--accent-light); }
    .modal-item.selected::after { content: '\2713'; font-size: 16px; color: var(--accent); font-weight: 700; }
    .modal-item.custom-item { color: var(--accent); font-weight: 500; border-top: 1px solid var(--separator); margin-top: 4px; padding-top: 16px; }
    .modal-item.custom-item:hover { background: rgba(0,122,255,0.08); }
    .modal-custom-input {
      margin: 8px 16px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: var(--text); border-radius: 12px; padding: 12px 16px; font-size: 16px;
      font-family: inherit; width: calc(100% - 32px); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .modal-custom-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
    .modal-custom-input::placeholder { color: var(--text-muted); }
    .source-tag {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 12px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      border: 1px solid transparent; user-select: none;
    }
    .source-tag:hover { transform: scale(1.05); }
    .source-tag:active { transform: scale(0.95); }
    .source-tag.active { opacity: 1; border-color: currentColor; }
    .source-tag:not(.active) { opacity: 0.35; }
    .source-tag.hh { background: rgba(0,122,255,0.12); color: #5ac8fa; }
    .source-tag.hh.active { background: rgba(0,122,255,0.25); box-shadow: 0 0 12px rgba(0,122,255,0.2); }
    .source-tag.sj { background: rgba(52,199,89,0.12); color: #34c759; }
    .source-tag.sj.active { background: rgba(52,199,89,0.25); box-shadow: 0 0 12px rgba(52,199,89,0.2); }
    .source-tag.rbc { background: rgba(175,82,222,0.12); color: #c586ff; }
    .source-tag.rbc.active { background: rgba(175,82,222,0.25); box-shadow: 0 0 12px rgba(175,82,222,0.2); }
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 9999px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
    .badge-hh { background: rgba(0,122,255,0.15); color: #5ac8fa; border: 1px solid rgba(0,122,255,0.2); }
    .badge-sj { background: rgba(52,199,89,0.15); color: #34c759; border: 1px solid rgba(52,199,89,0.2); }
    .badge-rbc { background: rgba(175,82,222,0.15); color: #c586ff; border: 1px solid rgba(175,82,222,0.2); }
    .btn-respond {
      background: linear-gradient(135deg, #007aff 0%, #0056b3 100%); color: #fff; font-weight: 600;
      border-radius: 12px; padding: 11px 22px; font-size: 14px; font-family: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease; border: none; cursor: pointer;
    }
    .btn-respond:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(0,122,255,0.3); }
    .btn-respond:active { transform: scale(0.97); }
    .vacancy-card {
      background: var(--card); backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }
    .vacancy-card:hover { transform: translateY(-3px) scale(1.01); box-shadow: 0 12px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); }
    .ai-card {
      background: linear-gradient(135deg, rgba(0,122,255,0.07) 0%, rgba(175,82,222,0.07) 100%);
      backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(0,122,255,0.15); border-radius: 20px;
    }
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(120px);
      background: rgba(28,28,30,0.95); backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 18px; padding: 14px 28px;
      font-size: 15px; z-index: 9999; transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
      pointer-events: none; color: var(--text); box-shadow: 0 12px 48px rgba(0,0,0,0.5);
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .gradient-text {
      background: linear-gradient(135deg, #007aff 0%, #5ac8fa 50%, #34c759 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .hero-glow { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.3; pointer-events: none; }
    .dot-pulse { animation: dotPulse 1.4s infinite ease-in-out both; }
    .dot-pulse:nth-child(1) { animation-delay: -0.32s; }
    .dot-pulse:nth-child(2) { animation-delay: -0.16s; }
    .dot-pulse:nth-child(3) { animation-delay: 0s; }
    @keyframes dotPulse { 0%,80%,100% { transform: scale(0); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in-up { animation: fadeInUp 0.45s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @media (max-width: 640px) { .tilt-btn { width: 100%; } }
  </style>
  <script>
    tailwind.config = { theme: { extend: { colors: { apple: { bg: '#000000', card: '#1c1c1e', accent: '#007aff', accentLight: '#5ac8fa', text: '#f2f2f7', secondary: '#8e8e93', muted: '#636366', success: '#34c759', danger: '#ff3b30' } } } } }
  </script>
</head>
<body class="min-h-screen pb-10">
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <div class="hero-glow" style="background:rgba(0,122,255,0.1);top:-120px;left:-80px;width:350px;height:350px;"></div>
    <div class="hero-glow" style="background:rgba(175,82,222,0.06);bottom:-180px;right:-80px;width:300px;height:300px;"></div>
    <div class="hero-glow" style="background:rgba(0,122,255,0.04);top:40%;left:50%;width:400px;height:400px;transform:translate(-50%,-50%);"></div>
  </div>
  <div class="relative z-10 max-w-lg mx-auto px-5 pt-8 pb-6">
    <header class="flex items-center justify-between mb-10">
      <div>
        <h1 class="text-3xl font-bold tracking-tight" style="letter-spacing:-0.02em;"><span class="gradient-text">JobGo</span></h1>
        <p class="text-xs mt-1.5" style="color:var(--text-secondary);">Поиск вакансий с AI-анализом</p>
      </div>
      <div class="w-11 h-11 rounded-2xl flex items-center justify-center" style="background:var(--glass);border:1px solid var(--glass-border);">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent-light);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </div>
    </header>
    <div class="space-y-4 mb-7">
      <div class="filter-card">
        <label class="filter-label">Профессия</label>
        <div class="relative">
          <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 z-10" style="color:var(--text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input type="text" id="professionInput" placeholder="Например: Frontend разработчик" class="form-input pl-12 bg-transparent border-none" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false">
          <div id="autocompleteDropdown" class="autocomplete-dropdown" role="listbox"></div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="filter-card" id="cityPickerCard">
          <label class="filter-label">Город</label>
          <div class="filter-value">
            <span id="cityDisplay" class="placeholder">Выберите город</span>
            <svg class="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
        <div class="filter-card" id="salaryPickerCard">
          <label class="filter-label">Зарплата</label>
          <div class="filter-value">
            <span id="salaryDisplay" class="placeholder">Выберите</span>
            <svg class="arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </div>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div class="filter-card">
          <label class="filter-label">Формат</label>
          <select id="scheduleSelect" class="form-select bg-transparent border-none py-2 text-sm">
            <option value="" class="bg-apple-card">Любой формат</option>
            <option value="remote" class="bg-apple-card">Удалённо</option>
            <option value="office" class="bg-apple-card">В офисе</option>
          </select>
        </div>
        <div class="filter-card">
          <label class="filter-label">Источники</label>
          <div class="flex gap-2 flex-wrap">
            <span class="source-tag hh active" data-source="hh">HH</span>
            <span class="source-tag sj active" data-source="superjob">SJ</span>
            <span class="source-tag rbc active" data-source="rbctalant">RBC</span>
          </div>
        </div>
      </div>
      <button id="searchBtn" class="tilt-btn w-full py-4 rounded-2xl font-bold text-base tracking-wide relative z-10" style="background:linear-gradient(135deg,#007aff 0%,#0056b3 100%);box-shadow:0 4px 24px rgba(0,122,255,0.25),inset 0 1px 0 rgba(255,255,255,0.15);">
        <span class="shine"></span>
        <span class="btn-text relative z-10 flex items-center justify-center gap-2" style="color:#fff;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          Найти вакансии
        </span>
      </button>
    </div>
    <div id="aiAnalysisBlock" class="ai-card rounded-2xl p-5 mb-6 hidden">
      <div class="flex items-center gap-3 mb-3">
        <span class="text-xl">✨</span>
        <h3 class="font-semibold text-sm" style="color:var(--accent-light);">Анализ AI-ассистента</h3>
      </div>
      <p id="aiAnalysisText" class="text-sm leading-relaxed" style="color:rgba(242,242,247,0.85);"></p>
    </div>
    <div id="loadingBlock" class="hidden flex flex-col items-center justify-center py-16">
      <div class="flex gap-2 mb-4">
        <div class="w-2.5 h-2.5 rounded-full" style="background:var(--accent);"></div>
        <div class="w-2.5 h-2.5 rounded-full" style="background:var(--accent);"></div>
        <div class="w-2.5 h-2.5 rounded-full" style="background:var(--accent);"></div>
      </div>
      <p class="text-sm" style="color:var(--text-secondary);">Ищем вакансии...</p>
    </div>
    <div id="errorBlock" class="hidden glass rounded-2xl p-5 mb-6 text-center">
      <svg class="w-10 h-10 mx-auto mb-3" style="color:var(--danger);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
      <p class="text-sm" style="color:var(--text-secondary);" id="errorText">Произошла ошибка. Попробуйте ещё раз.</p>
    </div>
    <div id="resultsHeader" class="hidden flex items-center justify-between mb-4 px-1">
      <h2 class="text-lg font-semibold" style="letter-spacing:-0.01em;">Найдено вакансий</h2>
      <span id="resultsCount" class="text-sm" style="color:var(--text-secondary);"></span>
    </div>
    <div id="vacanciesList" class="space-y-3"></div>
    <div id="emptyState" class="hidden flex flex-col items-center justify-center py-20 text-center">
      <div class="w-16 h-16 rounded-2xl flex items-center justify-center mb-4" style="background:var(--glass);border:1px solid var(--glass-border);">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      </div>
      <p class="text-sm" style="color:var(--text-secondary);">Начните поиск вакансий</p>
      <p class="text-xs mt-1.5" style="color:var(--text-muted);">Введите профессию и нажмите «Найти»</p>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="cityModal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3>Выбор города</h3>
        <button class="modal-close" data-modal="cityModal">&times;</button>
      </div>
      <div class="modal-search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="cityModalSearch" class="modal-search" placeholder="Поиск города..." autocomplete="off">
      </div>
      <div id="cityModalList" class="modal-list scrollbar-hide"></div>
      <input type="text" id="cityCustomInput" class="modal-custom-input hidden" placeholder="Введите название города">
    </div>
  </div>
  <div id="salaryModal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3>Выбор зарплаты</h3>
        <button class="modal-close" data-modal="salaryModal">&times;</button>
      </div>
      <div class="modal-search-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--text-muted);"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="salaryModalSearch" class="modal-search" placeholder="Поиск..." autocomplete="off">
      </div>
      <div id="salaryModalList" class="modal-list scrollbar-hide"></div>
      <input type="number" id="customSalaryInput" class="modal-custom-input hidden" placeholder="Мин. сумма в ₽" min="0">
    </div>
  </div>
  <script>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobGo — Поиск Вакансий</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4">
  <div class="max-w-md mx-auto">
    <h1 class="text-2xl font-bold text-center mb-6 text-blue-400">🔍 JobGo</h1>

    <!-- Форма поиска -->
    <div class="bg-slate-800 p-4 rounded-xl shadow-lg mb-6 border border-slate-700">
      <label class="block text-sm font-medium mb-2 text-slate-300">Кого ищем?</label>
      <input 
        type="text" 
        id="jobQuery" 
        placeholder="Например: Видеомонтажёр" 
        class="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-white mb-4 focus:outline-none focus:border-blue-500"
      />
      
      <button 
        onclick="searchJobs()" 
        id="searchBtn"
        class="w-full bg-blue-600 hover:bg-blue-500 font-semibold py-3 rounded-lg transition duration-200">
        Найти лучшие вакансии
      </button>
    </div>

    <!-- Индикатор загрузки -->
    <div id="loader" class="hidden text-center py-8">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-b-2 border-blue-500 mb-2"></div>
      <p class="text-slate-400 text-sm">Ищем вакансии и анализируем через ИИ...</p>
    </div>

    <!-- Ошибка -->
    <div id="errorBox" class="hidden bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-xl mb-4 text-center">
      <p id="errorText"></p>
    </div>

    <!-- Список вакансий -->
    <div id="results" class="space-y-4"></div>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    async function searchJobs() {
      const query = document.getElementById('jobQuery').value.trim();
      const loader = document.getElementById('loader');
      const results = document.getElementById('results');
      const errorBox = document.getElementById('errorBox');

      if (!query) {
        alert('Пожалуйста, введите профессию!');
        return;
      }

      loader.classList.remove('hidden');
      results.innerHTML = '';
      errorBox.classList.add('hidden');

      try {
        // Делаем запрос к нашей собственной Serverless-функции Vercel
        const response = await fetch(`/api/vacancies?query=${encodeURIComponent(query)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Произошла ошибка при загрузке');
        }

        if (!data.vacancies || data.vacancies.length === 0) {
          results.innerHTML = '<p class="text-center text-slate-400">Вакансий не найдено</p>';
          return;
        }

        // Рендерим результаты
        results.innerHTML = data.vacancies.map(job => `
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-blue-500 transition">
            <h3 class="font-bold text-lg text-blue-300">${job.title}</h3>
            <p class="text-sm text-slate-400 mb-1">${job.company}</p>
            <p class="text-green-400 font-medium text-sm mb-3">${job.salary}</p>
            <a href="${job.url}" target="_blank" class="inline-block w-full text-center bg-slate-700 hover:bg-slate-600 text-white text-sm py-2 rounded-lg font-medium transition">
              Откликнуться на HH
            </a>
          </div>
        `).join('');

      } catch (err) {
        document.getElementById('errorText').innerText = err.message;
        errorBox.classList.remove('hidden');
      } finally {
        loader.classList.add('hidden');
      }
    }
  </script>
</body>
</html>

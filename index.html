<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JobFinder · Telegram Mini App</title>
  <!-- Tailwind via CDN + тёмная тема Telegram -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Telegram WebApp JS SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* кастомные тёмно-синие тона, напоминающие Telegram */
    body {
      background: #0f172a; /* slate-900 */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    .telegram-card {
      background: #1e293b; /* slate-800 */
      border: 1px solid #334155;
      border-radius: 1.25rem;
      box-shadow: 0 12px 24px -8px rgba(0,0,0,0.6);
      transition: transform 0.1s ease, border-color 0.1s;
    }
    .telegram-card:hover {
      border-color: #3b82f6;
    }
    .input-telegram {
      background: #0f172a;
      border: 1px solid #334155;
      color: #f1f5f9;
      border-radius: 1rem;
      padding: 0.75rem 1rem;
      transition: border 0.15s;
    }
    .input-telegram:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    .btn-primary {
      background: #2563eb;
      color: white;
      font-weight: 600;
      border-radius: 2rem;
      padding: 0.75rem 1.5rem;
      transition: background 0.15s, transform 0.1s;
      border: none;
      width: 100%;
    }
    .btn-primary:active {
      transform: scale(0.97);
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .badge-salary {
      background: #1e293b;
      border: 1px solid #2d3a4f;
      color: #b9d0f0;
    }
    ::-webkit-scrollbar {
      width: 4px;
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 8px;
    }
  </style>
</head>
<body class="min-h-screen text-slate-200 p-4 pb-20 flex flex-col items-center">
  <div id="app" class="w-full max-w-2xl mx-auto">
    
    <!-- Заголовок с логотипом Telegram стиль -->
    <div class="flex items-center gap-3 mb-6 mt-2">
      <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white text-xl font-bold">👾</div>
      <h1 class="text-2xl font-bold tracking-tight text-white/90">Job<span class="text-blue-400">Finder</span></h1>
      <span class="ml-auto text-xs bg-slate-700/60 px-3 py-1 rounded-full text-slate-300">⚡ AI подбор</span>
    </div>

    <!-- Карточка формы поиска + DeepSeek Key -->
    <div class="telegram-card p-5 mb-6">
      <!-- Поле DeepSeek API Key (сохраняется в localStorage) -->
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-300 mb-1.5">🔑 DeepSeek API Key</label>
        <div class="flex gap-2">
          <input type="password" id="apiKeyInput" placeholder="sk-..." class="input-telegram flex-1 text-sm" />
          <button id="saveKeyBtn" class="bg-slate-700 hover:bg-slate-600 text-white px-4 rounded-full text-sm font-medium transition">Сохранить</button>
        </div>
        <div id="keyStatus" class="text-xs text-emerald-400 mt-1 hidden">✓ Ключ сохранён</div>
      </div>

      <!-- Форма поиска -->
      <div class="space-y-3">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Профессия / Навык</label>
          <input type="text" id="professionInput" placeholder="Например: Видеомонтажёр, Python Developer" class="input-telegram w-full" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Город</label>
            <input type="text" id="cityInput" placeholder="Москва, Санкт-Петербург" class="input-telegram w-full" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Желаемая ЗП (₽)</label>
            <input type="number" id="salaryInput" placeholder="150000" class="input-telegram w-full" />
          </div>
        </div>
        <button id="searchBtn" class="btn-primary mt-2 flex items-center justify-center gap-2">
          <span>🔍</span> Искать вакансии
        </button>
      </div>
    </div>

    <!-- Контейнер для карточек вакансий -->
    <div id="resultsContainer" class="space-y-4">
      <!-- Здесь будут карточки отрисованы динамически -->
      <div id="loadingPlaceholder" class="text-center py-10 text-slate-400 text-sm">
        <div class="text-4xl mb-2">🧐</div>
        Введите профессию и нажмите «Искать»
      </div>
    </div>

    <!-- Футер с ссылкой на GitHub (опционально) -->
    <div class="mt-8 text-center text-slate-500 text-[10px] opacity-50">
      Telegram Mini App · AI вакансии
    </div>
  </div>

  <script>
    (function() {
      // ---------- Инициализация Telegram WebApp ----------
      let tg = window.Telegram?.WebApp;
      if (tg) {
        tg.expand(); // растягиваем на весь экран
        tg.enableClosingConfirmation();
      }

      // ---------- DOM элементы ----------
      const apiKeyInput = document.getElementById('apiKeyInput');
      const saveKeyBtn = document.getElementById('saveKeyBtn');
      const keyStatus = document.getElementById('keyStatus');
      const professionInput = document.getElementById('professionInput');
      const cityInput = document.getElementById('cityInput');
      const salaryInput = document.getElementById('salaryInput');
      const searchBtn = document.getElementById('searchBtn');
      const resultsContainer = document.getElementById('resultsContainer');

      // ---------- Работа с localStorage для API ключа ----------
      function loadApiKey() {
        const saved = localStorage.getItem('deepseek_api_key');
        if (saved) {
          apiKeyInput.value = saved;
          keyStatus.classList.remove('hidden');
          keyStatus.textContent = '✓ Ключ загружен';
        }
      }
      loadApiKey();

      saveKeyBtn.addEventListener('click', function() {
        const key = apiKeyInput.value.trim();
        if (key.length > 10) {
          localStorage.setItem('deepseek_api_key', key);
          keyStatus.classList.remove('hidden');
          keyStatus.textContent = '✓ Ключ сохранён';
          setTimeout(() => {
            keyStatus.classList.add('hidden');
          }, 2500);
        } else {
          alert('Введите корректный DeepSeek API Key (начинается с sk-)');
        }
      });

      // ---------- Вспомогательные функции ----------
      function formatSalary(salary) {
        if (!salary) return 'Не указана';
        let from = salary.from ? salary.from : '';
        let to = salary.to ? salary.to : '';
        let currency = salary.currency || 'RUB';
        if (from && to) return `${from} – ${to} ${currency}`;
        if (from) return `от ${from} ${currency}`;
        if (to) return `до ${to} ${currency}`;
        return 'Не указана';
      }

      // Безопасное получение текста
      function getTextSafe(obj, path) {
        try {
          return path.split('.').reduce((acc, part) => acc[part], obj) || '';
        } catch { return ''; }
      }

      // ---------- Основной поиск ----------
      async function searchVacancies() {
        const profession = professionInput.value.trim();
        const city = cityInput.value.trim();
        const desiredSalary = parseInt(salaryInput.value.trim()) || 0;

        if (!profession) {
          alert('Введите профессию или навык');
          return;
        }

        const apiKey = localStorage.getItem('deepseek_api_key');
        if (!apiKey || apiKey.length < 10) {
          alert('Пожалуйста, сохраните действительный DeepSeek API Key в поле выше.');
          return;
        }

        // Показываем загрузку
        resultsContainer.innerHTML = `
          <div class="telegram-card p-6 text-center">
            <div class="animate-pulse flex flex-col items-center">
              <div class="w-12 h-12 rounded-full bg-blue-500/20 flex items-center justify-center mb-3">
                <span class="text-2xl">⏳</span>
              </div>
              <p class="text-slate-300">Поиск вакансий на hh.ru ...</p>
              <p class="text-xs text-slate-500 mt-1">Подождите, это займёт несколько секунд</p>
            </div>
          </div>
        `;

        try {
          // 1. Запрос к HeadHunter API
          let hhUrl = `https://api.hh.ru/vacancies?text=${encodeURIComponent(profession)}&per_page=30&search_field=name&only_with_salary=true`;
          if (city) {
            // поиск по городу (может быть не точным, но работает)
            hhUrl += `&area=1`; // Россия (код 1) — если город не указан, ищем по всей РФ
            // можно улучшить: искать по area, но для простоты оставим фильтр по тексту в описании
            // добавим город в текст для более релевантного поиска
            hhUrl = `https://api.hh.ru/vacancies?text=${encodeURIComponent(profession + ' ' + city)}&per_page=30&only_with_salary=true`;
          }

          const hhResponse = await fetch(hhUrl);
          if (!hhResponse.ok) throw new Error(`Ошибка HH: ${hhResponse.status}`);
          const hhData = await hhResponse.json();
          const vacancies = hhData.items || [];

          if (vacancies.length === 0) {
            resultsContainer.innerHTML = `
              <div class="telegram-card p-6 text-center">
                <span class="text-4xl block mb-2">😕</span>
                <p class="text-slate-300">По запросу «${profession}» ничего не найдено.</p>
                <p class="text-xs text-slate-500 mt-1">Попробуйте изменить запрос или город.</p>
              </div>
            `;
            return;
          }

          // Формируем краткое описание для DeepSeek (не более 3000 символов)
          let vacanciesText = vacancies.slice(0, 25).map((v, idx) => {
            const title = v.name || 'Без названия';
            const company = getTextSafe(v, 'employer.name') || 'Неизвестная компания';
            const salary = formatSalary(v.salary);
            const snippet = v.snippet?.requirement ? v.snippet.requirement.replace(/<[^>]+>/g, '') : 'Описание отсутствует';
            const cityName = v.area?.name || 'Город не указан';
            return `${idx+1}. ${title} | ${company} | ${cityName} | ${salary} | Требования: ${snippet.substring(0, 120)}`;
          }).join('\n');

          // 2. Запрос к DeepSeek API для ранжирования ТОП-5
          const prompt = `
  Ты — AI-ассистент по подбору вакансий. У пользователя профессия: "${profession}", город: "${city || 'любой'}", желаемая зарплата: ${desiredSalary || 'не указана'} ₽.

  Ниже список вакансий (до 25 шт.) с полями: номер, название, компания, город, зарплата, требования.
  Выбери ТОП-5 наиболее подходящих вакансий для этого пользователя. Для каждой выбранной вакансии напиши краткую причину (1-2 предложения), почему она подходит именно этому пользователю (соответствие профессии, зарплате, городу, навыкам).
  Верни строго в формате JSON-массива из 5 объектов: [{"title": "...", "company": "...", "salary": "...", "city": "...", "reason": "...", "url": "..."}]
  Используй только данные из списка. Если вакансий меньше 5, верни все подходящие.

  Список вакансий:
  ${vacanciesText}
  `;

          const deepseekPayload = {
            model: "deepseek-chat",
            messages: [
              { role: "system", content: "Ты — эксперт по подбору вакансий. Отвечай только JSON." },
              { role: "user", content: prompt }
            ],
            temperature: 0.3,
            max_tokens: 1200
          };

          const dsResponse = await fetch('https://api.deepseek.com/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${apiKey}`
            },
            body: JSON.stringify(deepseekPayload)
          });

          if (!dsResponse.ok) {
            const errText = await dsResponse.text();
            throw new Error(`DeepSeek API ошибка ${dsResponse.status}: ${errText}`);
          }
          const dsData = await dsResponse.json();
          let topVacancies = [];
          try {
            const content = dsData.choices[0].message.content;
            // Парсим JSON из ответа
            const jsonMatch = content.match(/\[[\s\S]*\]/);
            if (jsonMatch) {
              topVacancies = JSON.parse(jsonMatch[0]);
            } else {
              throw new Error('Не удалось извлечь JSON');
            }
          } catch (parseErr) {
            console.warn('Ошибка парсинга DeepSeek:', parseErr);
            // fallback: показать первые 5 вакансий без причин
            topVacancies = vacancies.slice(0, 5).map(v => ({
              title: v.name || 'Без названия',
              company: getTextSafe(v, 'employer.name') || 'Неизвестная компания',
              salary: formatSalary(v.salary),
              city: v.area?.name || 'Город не указан',
              reason: 'Подходит по навыкам (автоподбор)',
              url: v.alternate_url || '#'
            }));
          }

          // 3. Отображение карточек
          renderResults(topVacancies);

        } catch (error) {
          console.error(error);
          resultsContainer.innerHTML = `
            <div class="telegram-card p-6 text-center border-red-500/30">
              <span class="text-4xl block mb-2">⚠️</span>
              <p class="text-red-300 font-medium">Произошла ошибка</p>
              <p class="text-sm text-slate-400 mt-1">${error.message || 'Попробуйте позже'}</p>
              <button onclick="location.reload()" class="mt-3 text-blue-400 underline text-sm">Обновить</button>
            </div>
          `;
        }
      }

      // ---------- Отрисовка карточек ----------
      function renderResults(vacanciesArray) {
        if (!vacanciesArray || vacanciesArray.length === 0) {
          resultsContainer.innerHTML = `
            <div class="telegram-card p-6 text-center">
              <span class="text-3xl block mb-2">🤷</span>
              <p class="text-slate-300">Не удалось подобрать подходящие вакансии.</p>
            </div>
          `;
          return;
        }

        let html = '';
        vacanciesArray.forEach((item, index) => {
          const title = item.title || 'Вакансия';
          const company = item.company || 'Компания';
          const salary = item.salary || 'ЗП не указана';
          const city = item.city || 'Город не указан';
          const reason = item.reason || 'Рекомендовано AI.';
          const url = item.url || '#';

          html += `
            <div class="telegram-card p-5 transition hover:border-blue-500/50">
              <div class="flex justify-between items-start gap-2">
                <h3 class="text-lg font-semibold text-white/90 leading-tight">${escapeHtml(title)}</h3>
                <span class="text-xs bg-blue-600/20 text-blue-300 px-2.5 py-0.5 rounded-full">TOP ${index+1}</span>
              </div>
              <div class="flex flex-wrap gap-2 mt-1.5 text-sm text-slate-300">
                <span class="flex items-center gap-1"><span class="text-slate-400">🏢</span> ${escapeHtml(company)}</span>
                <span class="flex items-center gap-1"><span class="text-slate-400">📍</span> ${escapeHtml(city)}</span>
                <span class="badge-salary flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-mono">
                  <span class="text-slate-400">💰</span> ${escapeHtml(salary)}
                </span>
              </div>
              <div class="mt-3 text-sm bg-slate-800/60 p-3 rounded-xl border border-slate-700/50 text-slate-200">
                <span class="text-blue-300 text-xs font-medium">💡 Причина:</span>
                <p class="mt-0.5 leading-relaxed">${escapeHtml(reason)}</p>
              </div>
              <div class="mt-4 flex justify-end">
                <a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 text-sm bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-full text-white font-medium transition">
                  Откликнуться <span>→</span>
                </a>
              </div>
            </div>
          `;
        });

        resultsContainer.innerHTML = html;
        // Прокручиваем к результатам
        resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      // Простейший escape для защиты от XSS
      function escapeHtml(str) {
        if (!str) return '';
        const map = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        };
        return String(str).replace(/[&<>"']/g, function(m) { return map[m]; });
      }

      // ---------- Обработчик кнопки поиска ----------
      searchBtn.addEventListener('click', searchVacancies);

      // Также по нажатию Enter на поле профессии
      professionInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchBtn.click();
      });
      cityInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchBtn.click();
      });
      salaryInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') searchBtn.click();
      });

      // Если есть сохранённый ключ, можно подсветить
      console.log('JobFinder Mini App загружен');
    })();
  </script>
</body>
</html>

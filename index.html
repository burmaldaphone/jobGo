    :root {
      --bg: #000000;
      --glass: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --accent: #007aff;
      --accent-light: #5ac8fa;
      --text: #f2f2f7;
      --text-secondary: #8e8e93;
      --text-muted: #636366;
      --card: rgba(28, 28, 30, 0.72);
      --separator: rgba(255, 255, 255, 0.06);
      --success: #34c759;
      --danger: #ff3b30;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%; overflow-x: hidden;
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    }
    body {
      background:
        radial-gradient(ellipse 60% 40% at 30% -10%, rgba(0,122,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 80% 110%, rgba(88,86,214,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 50% 50%, rgba(0,122,255,0.02) 0%, transparent 80%),
        var(--bg);
    }
    .glass {
      background: var(--glass);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--glass-border);
    }
    .filter-card {
      background: var(--card);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 14px 16px;
      transition: transform 0.2s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.2s ease, border-color 0.2s ease;
      transform-style: preserve-3d; perspective: 1000px;
    }
    .filter-card:hover {
      transform: translateY(-2px) translateZ(4px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.12);
    }
    .filter-card:focus-within {
      border-color: rgba(0,122,255,0.4);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.12), 0 8px 32px rgba(0,0,0,0.4);
    }
    .filter-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-secondary); margin-bottom: 8px; display: block;
    }
    .tilt-btn {
      position: relative; transform-style: preserve-3d; perspective: 1000px;
      transition: transform 0.18s cubic-bezier(0.25,0.46,0.45,0.94), box-shadow 0.18s ease;
      cursor: pointer; overflow: hidden; border: none; outline: none;
      -webkit-user-select: none; user-select: none;
    }
    .tilt-btn::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,0.3) 0%, transparent 55%);
      opacity: 0; transition: opacity 0.35s ease; pointer-events: none; z-index: 1; border-radius: inherit;
    }
    .tilt-btn:hover::after { opacity: 1; }
    .tilt-btn:active { transform: scale(0.97) !important; transition: transform 0.08s ease; }
    .tilt-btn .shine {
      position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,0.1) 42%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0.1) 58%, transparent 70%);
      transform: rotate(20deg) translateX(-130%); pointer-events: none; z-index: 0; transition: transform 0.6s ease;
    }
    .tilt-btn:hover .shine { transform: rotate(20deg) translateX(30%); }
    .tilt-btn .btn-text { position: relative; z-index: 2; }
